# Generate with: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: storedb
        out: internal/store/storedb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type: { type: float64 }
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { type: float64, pointer: true }
